# Reviewed Phase 1 defaults; paths are within the private DB namespace.
listen_addresses = ''
port = 5432
unix_socket_directories = '/run/proofflow-budget'
unix_socket_permissions = 0770
password_encryption = 'scram-sha-256'
fsync = on
full_page_writes = on
synchronous_commit = on
max_connections = 24
shared_buffers = '128MB'
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
